name: flutter_better_media_picker
description: A paged photo and video picker for Flutter built on photo_manager, with album switching, multi-selection and iCloud download handling.
version: 1.0.0
homepage: https://github.com/dreampowder/flutter_better_media_picker

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  photo_manager: ^3.12.0
  infinite_scroll_pagination: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
